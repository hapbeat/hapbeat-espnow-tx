name: Firmware Build & Release

# Hapbeat ESP-NOW transmitter firmware — a 周辺機器 (peripheral) node. Per-env
# independent versioning (DEC-035): tags are namespaced tx/<env>/vX.Y.Z and a
# release attaches ONLY the tagged env. Aggregated into Studio's firmware
# library (aggregate-firmware-manifest.mjs maps this repo to "tx").
#
#   - push to master:               smoke-build the curated env matrix (no release).
#   - push of tx/<env>/v*:          build & release ONLY that one env.
#   - workflow_dispatch(tag_name):  re-release a single env (overwrite allowed).
#
# ⚠️ UNVERIFIED ON HARDWARE (2026-06-18): the in-CI esptool merge mirrors
#    hapbeat-device-firmware's classic-ESP32 path. Before pushing the FIRST real
#    tag, build on master (or local `pio run`) and flash an M5Stack via Studio
#    USB-Serial to confirm the merged firmware_full_serial.bin boots.
on:
  push:
    branches: [master]
    # `**` (not `*`) is required: GitHub tag globs treat `*` as NOT matching
    # `/`, so `*/v*` would miss the 3-segment tag tx/<env>/vX.Y.Z. `**/v*`
    # matches `<repoShort>/<env>/` then `v*`.
    tags: ['**/v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Namespaced tag to release (e.g. tx/m5stack_audio_tx/v0.1.0)'
        required: true

jobs:
  # --------------------------------------------------------------------------
  # Smoke build — master push only.
  # --------------------------------------------------------------------------
  smoke:
    name: Smoke build ${{ matrix.env }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32             # Bridge command relay (M5Stack Basic)
          - m5stack_audio_tx  # ESP-NOW live audio source (M5Stack Basic)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO + esptool
        run: pip install platformio "esptool>=4.5,<5"
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

  # --------------------------------------------------------------------------
  # Release — single env, on a namespaced tag push or manual dispatch.
  # --------------------------------------------------------------------------
  release:
    name: Release single env
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve & validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^[a-z]+/[A-Za-z0-9_]+/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' must be <repoShort>/<env>/vX.Y.Z (e.g. tx/m5stack_audio_tx/v0.1.0)"
            exit 1
          fi
          ENVN="${TAG#*/}"; ENVN="${ENVN%/v*}"
          {
            echo "name=$TAG"
            echo "env=$ENVN"
          } >> "$GITHUB_OUTPUT"
          echo "Release env='$ENVN' tag='$TAG'"

      - name: Overwrite guard (tag push only)
        if: github.event_name != 'workflow_dispatch'
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release '${{ steps.tag.outputs.name }}' already exists. Re-release via workflow_dispatch."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO + esptool
        run: pip install platformio "esptool>=4.5,<5"

      - name: Build ${{ steps.tag.outputs.env }}
        run: pio run -e ${{ steps.tag.outputs.env }}

      # Serial-only: produce the merged firmware_full_serial.bin (no app_ota).
      # CoreS3 is ESP32-S3 (bootloader@0x0); the others are classic ESP32
      # (bootloader@0x1000, padded so the merged image still starts at 0x0).
      - name: Collect + merge artifacts (single env)
        run: |
          mkdir -p release-artifacts
          E="${{ steps.tag.outputs.env }}"
          b=".pio/build/$E"
          if [[ "$E" == *cores3* ]]; then
            CHIP=esp32s3; BOOT_OFF=0x0
          else
            CHIP=esp32;   BOOT_OFF=0x1000
          fi
          python -m esptool --chip "$CHIP" merge_bin \
            -o "release-artifacts/${E}_firmware_full_serial.bin" \
            --flash_size 4MB --flash_mode dio \
            "$BOOT_OFF" "$b/bootloader.bin" \
            0x8000      "$b/partitions.bin" \
            0x10000     "$b/firmware.bin"
          if [ -f "$b/variant.json" ]; then
            cp "$b/variant.json" "release-artifacts/${E}_variant.json"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Generate manifest.json
        run: node .github/scripts/generate-manifest.mjs release-artifacts "${{ steps.tag.outputs.name }}"

      - name: List release files
        run: ls -lh release-artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Transmitter Firmware ${{ steps.tag.outputs.name }}
          body: |
            Hapbeat ESP-NOW transmitter firmware — env `${{ steps.tag.outputs.env }}` (${{ steps.tag.outputs.name }}, 周辺機器).

            ## Artifacts

            | File | Description |
            |------|-------------|
            | `*_firmware_full_serial.bin` | Merged image for **USB Serial** flashing (serial-only — no Wi-Fi OTA) |
            | `manifest.json` | Machine-readable fragment consumed by Hapbeat Studio |

            Flash via [Hapbeat Studio](https://studio.hapbeat.com) — no PlatformIO required.
          files: |
            release-artifacts/*.bin
            release-artifacts/manifest.json

      - name: Trigger Studio redeploy
        run: |
          echo '{"event_type":"firmware-released","client_payload":{"fw_tag":"${{ steps.tag.outputs.name }}"}}' \
            | gh api repos/Hapbeat/hapbeat-studio/dispatches --method POST --input -
        env:
          GH_TOKEN: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
