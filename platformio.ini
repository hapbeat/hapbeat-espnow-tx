; Bridge command relay (original role): receives binary frames from the
; Bridge over USB serial and re-broadcasts them as ESP-NOW commands.
[env:esp32]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3
extra_scripts = post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW live audio source (DEC-034): PA line-in (M5 Module-Audio / ES8388)
; → 48k→16k decimate → IMA-ADPCM → 0xAA stream broadcast. Configured from
; Studio over USB Web Serial (get_info / set_espnow_channel / set_input_level).
[env:m5stack_audio_tx]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_SOURCE
extra_scripts = post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0
