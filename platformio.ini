; Bridge command relay (original role): receives binary frames from the
; Bridge over USB serial and re-broadcasts them as ESP-NOW commands.
[env:esp32]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW live audio source (DEC-034): PA line-in (M5 Module-Audio / ES8388)
; → 48k→16k decimate → IMA-ADPCM → 0xAA stream broadcast. Configured from
; Studio over USB Web Serial (get_info / set_espnow_channel / set_input_level).
; DEC-033: adds piggyback (§3.2) + in-flight control + display stats.
[env:m5stack_audio_tx]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_SOURCE
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW live audio source on M5Stack CoreS3 (ESP32-S3) + Module Audio (ES8388).
; Uses M5Unified + the official M5Module-Audio driver, which resolves the
; board-correct I2S/I2C pins (incl. the S3 bck/mck swap) — no pins hard-coded.
; The Module Audio A/B switch must be set to "B" for CoreS3.
[env:m5stack_cores3_audio_tx]
platform = espressif32@6.5.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_SOURCE
    -DBOARD_CORES3
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Unified
    https://github.com/m5stack/M5Module-Audio.git
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW repeater (DEC-033): receives 0xAA stream packets from a single source
; MAC and re-broadcasts verbatim. 1-hop relay — no source MAC = no relay.
; Configured from Studio over USB Web Serial (set_relay_source / set_espnow_channel).
[env:m5stack_repeater]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DREPEATER
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0
