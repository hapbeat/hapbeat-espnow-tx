; Bridge command relay (original role): receives binary frames from the
; Bridge over USB serial and re-broadcasts them as ESP-NOW commands.
[env:esp32]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW live audio source (DEC-034): PA line-in (M5 Module-Audio / ES8388)
; → 48k→16k decimate → IMA-ADPCM → 0xAA stream broadcast. Configured from
; Studio over USB Web Serial (get_info / set_espnow_channel / set_input_level).
; DEC-033: adds piggyback (§3.2) + in-flight control + display stats.
[env:m5stack_audio_tx]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_SOURCE
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW live audio source on M5Stack CoreS3 (ESP32-S3) + Module Audio (ES8388).
; Uses M5Unified + the official M5Module-Audio driver, which resolves the
; board-correct I2S/I2C pins (incl. the S3 bck/mck swap) — no pins hard-coded.
; The Module Audio A/B switch must be set to "B" for CoreS3.
[env:m5stack_cores3_audio_tx]
platform = espressif32@6.5.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_SOURCE
    -DBOARD_CORES3
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Unified
    https://github.com/m5stack/M5Module-Audio.git
    bblanchon/ArduinoJson @ ^7.0.0
    ; Opus encode (DEC-042) — same fixed-point port the receiver decodes with.
    ; Only used on CoreS3 (ESP32-S3) for the Opus stream modes; classic Core
    ; stays ADPCM-only. opus_config.h ships FIXED_POINT=1 / DISABLE_FLOAT_API=1.
    https://github.com/pschatzmann/arduino-libopus.git

; ESP-NOW repeater (DEC-033/DEC-043): receives 0xAA stream packets and re-broadcasts
; them with the RELAYED flag (byte[1] bit7) set. Auto origin-follow (or NVS pin).
; Configured from Studio over USB Web Serial (set_relay_source / set_espnow_channel).
[env:m5stack_repeater]
platform = espressif32@6.5.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DREPEATER
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; ESP-NOW repeater on Seeed XIAO ESP32-C6 (headless — no display), DEC-043. Small
; coverage extender with an external u.FL antenna. Uses the pioarduino platform
; fork (arduino-esp32 3.x / IDF5) because espressif32@6.5.0 (Arduino 2.0.x) has no
; ESP32-C6 support; this per-env platform override coexists with the 6.5.0 envs
; above. Configured from Studio over USB Web Serial + a BOOT-button channel cycle.
[env:xiao_c6_repeater]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; Pin the arduino-esp32 3.3.9 core explicitly. pioarduino marks its framework
; package "optional", and the official espressif32@6.5.0 (the other envs) already
; occupies the shared framework-arduinoespressif32 dir with arduino 2.0.14 — which
; lacks tools/pioarduino-build.py, so the 3.3.9 core is never resolved
; (FRAMEWORK_DIR None). A URL pin installs 3.3.9 as a separate hashed package dir,
; letting both cores coexist. This block applies only to this env.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DREPEATER
    -DBOARD_XIAO_C6
    -DARDUINO_USB_CDC_ON_BOOT=1
; Headless build: exclude the M5 LCD (display.cpp → display_stub.cpp) plus the
; bridge-relay / audio-source TUs a repeater never uses — keeps the IDF5 build
; free of M5 deps and arduino-2.x-only code.
build_src_filter =
    +<*>
    -<display.cpp>
    -<audio_source.cpp>
    -<serial_handler.cpp>
    -<command_dispatcher.cpp>
    -<time_sync.cpp>
extra_scripts =
    pre:scripts/build_version.py
    post:scripts/gen_variant.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; Optional Seeed XIAO Expansion Board OLED (SSD1306 128x64) — auto-detected at
    ; boot; a bare XIAO ignores it. Seeed's official example uses U8g2.
    olikraus/U8g2 @ ^2.35.0
